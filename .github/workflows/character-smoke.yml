name: ORCHESTRA foundation and cognitive smoke
on:
  pull_request:
  push:
    branches: [feat/orchestra-spotem-foundation-20260920]
jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reference smoke dependencies
        run: python -m pip install 'cryptography>=42,<47' 'fastapi>=0.110,<1' 'httpx>=0.27,<1' 'uvicorn>=0.29,<1'
      - name: Compile Python
        run: python -m compileall -q character chain cognitive tests
      - name: Run unit and smoke tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
